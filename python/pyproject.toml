[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ehs-metrics"
version = "0.1.0"
description = "Python port of the ehs-metrics OSHA incident-rate library (TRIR, DART, LTIR, severity)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Priyatham Chimmani" }]
keywords = ["osha", "ehs", "trir", "dart", "safety", "incident-rate"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
