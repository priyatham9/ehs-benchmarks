name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: false

      - name: Build
        run: npm run build

      - name: Check for build drift
        run: |
          if git diff --exit-code docs/; then
            echo "Build output matches committed docs/"
          else
            echo "ERROR: Build output differs from committed docs/"
            echo ""
            echo "Differences:"
            git diff docs/
            exit 1
          fi
